version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Move the pinned development tools. The lower bounds of the library's own
    # dependencies are changed by hand.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
